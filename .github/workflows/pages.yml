name: Deploy to GitHub Pages

on:
  push:
    branches:
      - feature/halloween-escape-game-9910344024536113838
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload game as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: game

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
