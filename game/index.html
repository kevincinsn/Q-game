<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魯米的萬聖節大逃脫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>🎃 魯米的萬聖節大逃脫 👻</h1>
            <div class="cast">
                <img src="assets/rumi.png" alt="魯米">
                <img src="assets/tiger.png" alt="老虎朋友">
                <img src="assets/bird.png" alt="小鳥朋友">
            </div>
            <p>你好呀！我是魯米！來幫我逃出這個可愛的萬聖節密室吧！</p>
            <div class="input-group">
                <label for="player-name">請輸入你的名字代號：</label>
                <input type="text" id="player-name" placeholder="例如：小紅帽" maxlength="10">
            </div>
            <div class="save-code-actions">
                <button id="copy-code-start-btn" class="secondary-btn">📋 複製存檔碼</button>
                <button id="load-code-start-btn" class="secondary-btn">📥 輸入存檔碼</button>
            </div>
            <div class="instructions">
                <h3>🎮 怎麼玩？</h3>
                <p>💻 電腦：使用鍵盤方向鍵 (上下左右) 移動。</p>
                <p>📱 手機/平板：按下方的方向鍵(按住會一直走),或在迷宮上用手指滑動。</p>
                <p>收集 <span class="emoji">🍬</span> 糖果 和 <span class="emoji">🎃</span> 南瓜 可以加分！</p>
                <p>找到拿著鑰匙的 <b>老虎朋友</b>,再到 <b>小鳥朋友</b> 守著的門 <span class="emoji">🚪</span> 逃出去喔！</p>
                <p>⏰ 你有 3 分鐘的時間！</p>
            </div>
            <button id="start-btn">開始遊戲</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <div id="hud">
                <div id="player-info">玩家：<span id="display-name"></span></div>
                <div id="score-display">分數：<span id="score">0</span></div>
                <div id="timer-display">時間：<span id="timer">03:00</span></div>
                <div id="inventory">鑰匙：<span id="key-status">❌</span></div>
            </div>
            <div id="canvas-wrap">
                <canvas id="gameCanvas"></canvas>
            </div>

            <!-- Mobile Controls -->
            <div id="mobile-controls">
                <p class="swipe-hint">在迷宮上滑動手指也可以移動喔</p>
                <div id="dpad">
                    <button id="btn-up" class="control-btn" aria-label="上">▲</button>
                    <button id="btn-left" class="control-btn" aria-label="左">◀</button>
                    <button id="btn-right" class="control-btn" aria-label="右">▶</button>
                    <button id="btn-down" class="control-btn" aria-label="下">▼</button>
                </div>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen hidden">
            <h1 id="end-title">遊戲結束</h1>
            <p id="end-message"></p>
            <div class="stats">
                <p>你的分數：<span id="final-score">0</span></p>
            </div>
            <div class="save-code-actions">
                <button id="copy-code-end-btn" class="secondary-btn">📋 複製存檔碼</button>
            </div>
            <button id="restart-btn">再玩一次</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
